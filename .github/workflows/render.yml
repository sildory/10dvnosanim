name: Production 4K Cycles Render

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-shards:
    name: Shard ${{ matrix.shard }} (Frames ${{ matrix.start }}-${{ matrix.end }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            start: 1
            end: 15
          - shard: 2
            start: 16
            end: 30
          - shard: 3
            start: 31
            end: 45
          - shard: 4
            start: 46
            end: 60

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Кэширование ассетов
        uses: actions/cache@v4
        with:
          path: assets_cache
          key: assets-${{ hashFiles('projects/**/manifest.json') }}
          restore-keys: |
            assets-

      - name: 5. Рендер диапазона кадров шардом в 4K Cycles
        run: |
          python main.py \
            --project test_studio \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --profile 4k \
            --samples 64 \
            --output output/frames

      - name: 6. Загрузка кадров шарда в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: frames-shard-${{ matrix.shard }}
          path: output/frames/*.png
          retention-days: 2

  assemble-video:
    name: Final Assembly & Release (4K Master)
    needs: render-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Создание папки для кадров
        run: mkdir -p output/all_frames

      - name: 3. Скачивание и объединение всех шардов
        uses: actions/download-artifact@v4
        with:
          pattern: frames-shard-*
          path: output/all_frames
          merge-multiple: true

      - name: 4. Проверка собранных кадров
        run: |
          echo "Всего кадров собрано: $(ls -1 output/all_frames/*.png | wc -l)"

      - name: 5. Сборка финального 4K MP4 (H.264 Master, BT.709)
        run: |
          ffmpeg -y -framerate 60 -i output/all_frames/frame_%04d.png \
            -c:v libx264 \
            -preset slow \
            -crf 14 \
            -pix_fmt yuv420p \
            -color_primaries bt709 \
            -color_trc bt709 \
            -colorspace bt709 \
            output/10dvnosanim_4k_master.mp4

      - name: 6. Сохранение мастера в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: 10dvnosanim-4k-master
          path: output/10dvnosanim_4k_master.mp4
          retention-days: 14

      - name: 7. Публикация готового 4K-видео в GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-master-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" output/10dvnosanim_4k_master.mp4 \
            --title "10DVNOSANIM 4K Cycles Master ($TAG)" \
            --notes "Автоматическая мастер-сборка 4K из ш ардов Cycles CPU."
