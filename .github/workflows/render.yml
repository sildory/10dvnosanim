name: Production 4K Cycles Render

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Выберите эпизод для 4K рендера'
        required: true
        type: choice
        default: 'ep01_anticipation'
        options:
          - 'ep01_anticipation'
          - 'ep02_unequal_pour'
          - 'ep03_disbelief'
          - 'ep04_tantrum'
          - 'ep05_sabotage'

permissions:
  contents: write

jobs:
  render-shards:
    name: Shard ${{ matrix.shard }} (Frames ${{ matrix.start }}-${{ matrix.end }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            start: 1
            end: 30
          - shard: 2
            start: 31
            end: 60
          - shard: 3
            start: 61
            end: 90
          - shard: 4
            start: 91
            end: 120
          - shard: 5
            start: 121
            end: 150
          - shard: 6
            start: 151
            end: 180

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Установка системных библиотек и зависимостей bpy
        run: |
          sudo apt-get update && sudo apt-get install -y libxxf86vm1 libgl1 libxfixes3 libxi6 libxkbcommon0
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Кэширование ассетов
        uses: actions/cache@v4
        with:
          path: assets_cache
          key: assets-${{ hashFiles('episodes/**') }}
          restore-keys: |
            assets-

      - name: 5. Параллельный 4K рендер диапазона кадров
        run: |
          python main.py \
            --episode "${{ github.event.inputs.episode }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --profile 4k \
            --samples 40 \
            --output output/frames

      - name: 6. Загрузка кадров шарда в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: frames-shard-${{ matrix.shard }}
          path: output/frames/*.png
          retention-days: 2

  assemble-video:
    name: Final Assembly & Release (4K Master)
    needs: render-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Создание папки для кадров
        run: mkdir -p output/all_frames

      - name: 3. Скачивание и объединение всех шардов
        uses: actions/download-artifact@v4
        with:
          pattern: frames-shard-*
          path: output/all_frames
          merge-multiple: true

      - name: 4. Проверка собранных кадров
        run: |
          TOTAL=$(ls -1 output/all_frames/*.png 2>/dev/null | wc -l)
          echo "Всего кадров собрано: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "Ошибка: кадры не найдены!"
            exit 1
          fi

      - name: 5. Сборка финального 4K MP4 (H.264 Master, BT.709)
        run: |
          ffmpeg -y -framerate 30 -pattern_type glob -i 'output/all_frames/frame_*.png' \
            -c:v libx264 \
            -preset fast \
            -crf 16 \
            -pix_fmt yuv420p \
            -color_primaries bt709 \
            -color_trc bt709 \
            -colorspace bt709 \
            "output/${{ github.event.inputs.episode }}_4k_master.mp4"

      - name: 6. Сохранение мастера в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.episode }}-4k-master
          path: output/*_4k_master.mp4
          retention-days: 14

      - name: 7. Публикация готового 4K-видео в GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.episode }}-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" output/*_4k_master.mp4 \
            --title "${{ github.event.inputs.episode }} 4K Master ($TAG)" \
            --notes "Автоматическая высокоскоростная мастер-сборка 4K из 6 параллельных шардов Cycles." 
