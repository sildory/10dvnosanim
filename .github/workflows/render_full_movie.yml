name: Render Full 30s Movie (All 5 Episodes)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Качество рендера всего фильма'
        required: true
        type: choice
        default: 'preview'
        options:
          - 'preview'
          - 'fullhd'
          - '4k'

permissions:
  contents: write

jobs:
  render-all-episodes:
    name: Shard ${{ matrix.shard }} (Ep ${{ matrix.ep_num }}: ${{ matrix.episode }} [${{ matrix.start }}-${{ matrix.end }}])
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Эпизод 1: Предвкушение (Кадры фильма 1 - 180) ---
          - shard: 1
            episode: 'ep01_anticipation'
            ep_num: 1
            start: 1
            end: 90
            offset: 0
          - shard: 2
            episode: 'ep01_anticipation'
            ep_num: 1
            start: 91
            end: 180
            offset: 0

          # --- Эпизод 2: Несправедливость (Кадры фильма 181 - 360) ---
          - shard: 3
            episode: 'ep02_unequal_pour'
            ep_num: 2
            start: 1
            end: 90
            offset: 180
          - shard: 4
            episode: 'ep02_unequal_pour'
            ep_num: 2
            start: 91
            end: 180
            offset: 180

          # --- Эпизод 3: Осознание и шок (Кадры фильма 361 - 540) ---
          - shard: 5
            episode: 'ep03_disbelief'
            ep_num: 3
            start: 1
            end: 90
            offset: 360
          - shard: 6
            episode: 'ep03_disbelief'
            ep_num: 3
            start: 91
            end: 180
            offset: 360

          # --- Эпизод 4: Бунт и бросок миски (Кадры фильма 541 - 720) ---
          - shard: 7
            episode: 'ep04_tantrum'
            ep_num: 4
            start: 1
            end: 90
            offset: 540
          - shard: 8
            episode: 'ep04_tantrum'
            ep_num: 4
            start: 91
            end: 180
            offset: 540

          # --- Эпизод 5: Саботаж и триумф (Кадры фильма 721 - 900) ---
          - shard: 9
            episode: 'ep05_sabotage'
            ep_num: 5
            start: 1
            end: 90
            offset: 720
          - shard: 10
            episode: 'ep05_sabotage'
            ep_num: 5
            start: 91
            end: 180
            offset: 720

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Установка системных библиотек и зависимостей bpy
        run: |
          sudo apt-get update && sudo apt-get install -y libxxf86vm1 libgl1 libxfixes3 libxi6 libxkbcommon0
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Кэширование ассетов
        uses: actions/cache@v4
        with:
          path: assets_cache
          key: assets-${{ hashFiles('episodes/**') }}
          restore-keys: |
            assets-

      - name: 5. Параллельный рендер диапазона кадров
        run: |
          python main.py \
            --episode "${{ matrix.episode }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --profile "${{ github.event.inputs.profile || 'preview' }}" \
            --output output/frames

      - name: 6. Сквозная нумерация кадров фильма (Offset +${{ matrix.offset }})
        run: |
          python -c "
          import os, re
          offset = int('${{ matrix.offset }}')
          frames_dir = 'output/frames'
          for fname in os.listdir(frames_dir):
              m = re.match(r'frame_(\d+)\.png', fname)
              if m:
                  num = int(m.group(1)) + offset
                  old_p = os.path.join(frames_dir, fname)
                  new_p = os.path.join(frames_dir, f'global_frame_{num:05d}.png')
                  os.rename(old_p, new_p)
          "

      - name: 7. Загрузка кадров шарда в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: frames-shard-${{ matrix.shard }}
          path: output/frames/global_frame_*.png
          retention-days: 2

  assemble-full-movie:
    name: Assemble & Publish Full 30s Movie
    needs: render-all-episodes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Создание папки для финальных кадров
        run: mkdir -p output/all_frames

      - name: 3. Скачивание и объединение всех 10 шардов
        uses: actions/download-artifact@v4
        with:
          pattern: frames-shard-*
          path: output/all_frames
          merge-multiple: true

      - name: 4. Проверка полноты фильма (Все 900 кадров)
        run: |
          TOTAL=$(ls -1 output/all_frames/global_frame_*.png 2>/dev/null | wc -l)
          echo "Всего собрано кадров: $TOTAL из 900"
          if [ "$TOTAL" -lt 900 ]; then
            echo "ВНИМАНИЕ: Собрано $TOTAL кадров из 900. Проверьте логи незавершенных шардов."
          fi
          if [ "$TOTAL" -eq 0 ]; then
            echo "Ошибка: кадры не найдены!"
            exit 1
          fi

      - name: 5. Финальная сборка единого MP4 (H.264 Master, 30 FPS, BT.709)
        run: |
          mkdir -p output/movie
          ffmpeg -y -framerate 30 -pattern_type glob -i 'output/all_frames/global_frame_*.png' \
            -c:v libx264 \
            -preset fast \
            -crf 17 \
            -pix_fmt yuv420p \
            -color_primaries bt709 \
            -color_trc bt709 \
            -colorspace bt709 \
            output/movie/parrots_injustice_30s_full_movie.mp4

      - name: 6. Сохранение мастера фильма в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: parrots-full-movie-${{ github.event.inputs.profile || 'preview' }}
          path: output/movie/parrots_injustice_30s_full_movie.mp4
          retention-days: 14

      - name: 7. Публикация готового фильма в GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="movie-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" output/movie/parrots_injustice_30s_full_movie.mp4 \
            --title "Parrots Injustice - 30s Master (${{ github.event.inputs.profile || 'preview' }})" \
            --notes "Полный 30-секундный фильм (все 5 эпизодов, 900 кадров), отрендеренный в 10 параллельных потоках Cycles."
