name: Fast Preview Render

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Имя эпизода для рендера'
        required: true
        default: 'ep01_bay'
      start_frame:
        description: 'Начальный кадр'
        required: true
        default: '1'
      end_frame:
        description: 'Конечный кадр'
        required: true
        default: '60'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Установка bpy и Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Кэширование ассетов
        uses: actions/cache@v4
        with:
          path: assets_cache
          key: assets-${{ hashFiles('episodes/**', 'projects/**') }}
          restore-keys: |
            assets-

      - name: 5. Быстрый рендер превью-кадров (540p, Cycles Turbo)
        run: |
          python main.py \
            --episode ${{ github.event.inputs.episode || 'ep01_bay' }} \
            --start ${{ github.event.inputs.start_frame || 1 }} \
            --end ${{ github.event.inputs.end_frame || 60 }} \
            --step 1 \
            --profile preview \
            --output output/frames

      - name: 6. Сборка видео через FFmpeg
        run: |
          mkdir -p output/video
          ffmpeg -y -framerate 30 -i output/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -preset ultrafast -crf 22 \
            output/video/preview_${{ github.event.inputs.episode || 'ep01_bay' }}.mp4

      - name: 7. Загрузка готового MP4 в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: preview-video
          path: output/video/preview_*.mp4
          retention-days: 7
