name: Fast Preview Render

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Выберите эпизод для превью'
        required: true
        type: choice
        default: 'ep01_anticipation'
        options:
          - 'ep01_anticipation'
          - 'ep02_unequal_pour'
          - 'ep03_disbelief'
          - 'ep04_tantrum'
          - 'ep05_sabotage'
      start_frame:
        description: 'Начальный кадр'
        required: true
        default: '1'
      end_frame:
        description: 'Конечный кадр'
        required: true
        default: '180'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Установка системных библиотек и зависимостей bpy
        run: |
          sudo apt-get update && sudo apt-get install -y libxxf86vm1 libgl1 libxfixes3 libxi6 libxkbcommon0 ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Кэширование ассетов
        uses: actions/cache@v4
        with:
          path: assets_cache
          key: assets-${{ hashFiles('episodes/**') }}
          restore-keys: |
            assets-

      - name: 5. Быстрый рендер превью-кадров (Cycles Fast)
        run: |
          python main.py \
            --episode "${{ github.event.inputs.episode }}" \
            --start "${{ github.event.inputs.start_frame }}" \
            --end "${{ github.event.inputs.end_frame }}" \
            --step 1 \
            --profile preview \
            --output output/frames

      - name: 6. Сборка видео через FFmpeg
        run: |
          mkdir -p output/video
          ffmpeg -y -framerate 30 -pattern_type glob -i 'output/frames/frame_*.png' \
            -c:v libx264 -pix_fmt yuv420p -preset fast -crf 20 \
            "output/video/preview_${{ github.event.inputs.episode }}.mp4"

      - name: 7. Загрузка готового MP4 в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.inputs.episode }}
          path: output/video/preview_*.mp4
          retention-days: 7
