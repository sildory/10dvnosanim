name: Render Movie (All Episodes - Dynamic Shards)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль качества рендера'
        required: true
        type: choice
        default: 'preview'
        options:
          - 'preview'
          - 'fullhd'
          - '4k'
      output_name:
        description: 'Имя итогового фильма (без .mp4)'
        required: false
        default: 'master_movie'

permissions:
  contents: write

jobs:
  # =========================================================================
  # ЭТАП 1: Расчёт лёгких параллельных шардов (по ~18 кадров)
  # =========================================================================
  plan-shards:
    name: "Plan Parallel Shards"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      episodes: ${{ steps.build-matrix.outputs.episodes }}
      total_jobs: ${{ steps.build-matrix.outputs.total_jobs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Shards Matrix
        id: build-matrix
        run: |
          python -c "
          import os, json, sys, math

          ep_dir = 'episodes'
          if not os.path.isdir(ep_dir):
              print(f'Error: folder {ep_dir} not found', file=sys.stderr)
              sys.exit(1)

          episodes = sorted([
              f[:-3] for f in os.listdir(ep_dir)
              if f.startswith('ep') and f.endswith('.py') and not f.startswith('__')
          ])

          if not episodes:
              print('Error: no episodes found in episodes/', file=sys.stderr)
              sys.exit(1)

          total_frames = 180
          TARGET_FRAMES_PER_SHARD = 18
          shards_per_ep = max(4, math.ceil(total_frames / TARGET_FRAMES_PER_SHARD))

          matrix_include = []
          for ep in episodes:
              frames_per_shard = math.ceil(total_frames / shards_per_ep)
              for s in range(shards_per_ep):
                  start = s * frames_per_shard + 1
                  end = min((s + 1) * frames_per_shard, total_frames)
                  if start <= total_frames:
                      matrix_include.append({
                          'episode': ep,
                          'shard': s + 1,
                          'start': start,
                          'end': end
                      })

          print(f'Configured {len(matrix_include)} shards ({shards_per_ep} per ep) for {len(episodes)} episodes.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'matrix={json.dumps(matrix_include)}\n')
              out.write(f'episodes={json.dumps(episodes)}\n')
              out.write(f'total_jobs={len(matrix_include)}\n')
          "

  # =========================================================================
  # ЭТАП 2: Параллельный рендер шардов (10GB Swap + nice приоритет агента)
  # =========================================================================
  render-shards:
    name: "${{ matrix.episode }} [${{ matrix.start }}..${{ matrix.end }}]"
    needs: plan-shards
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan-shards.outputs.matrix) }}

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Выделение 10GB Swap (Защита от OOM и разрыва соединения)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 3. Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 4. Установка системных библиотек и зависимостей bpy
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libxxf86vm1 libgl1 libxfixes3 libxi6 libxkbcommon0
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Кэширование ассетов (HDRI / PBR)
        uses: actions/cache@v4
        with:
          path: assets_cache
          key: assets-${{ hashFiles('episodes/**') }}
          restore-keys: |
            assets-

      - name: 6. Рендер диапазона кадров шардом (с защитой приоритета агента)
        run: |
          nice -n 10 python main.py \
            --episode "${{ matrix.episode }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --step 1 \
            --profile "${{ github.event.inputs.profile || 'preview' }}" \
            --output "output/frames/${{ matrix.episode }}"

      - name: 7. Сохранение кадров шарда в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: "frames-${{ matrix.episode }}-shard-${{ matrix.shard }}"
          path: "output/frames/${{ matrix.episode }}/*.png"
          retention-days: 1

  # =========================================================================
  # ЭТАП 3: Сборка всех кадров, видео эпизодов и мастер-фильма
  # =========================================================================
  assemble-movie:
    name: "Assemble Movie & Publish"
    needs: [plan-shards, render-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 3. Создание структуры папок
        run: |
          mkdir -p output/downloaded_shards
          mkdir -p output/episodes_frames
          mkdir -p output/episodes_video
          mkdir -p output/movie

      - name: 4. Скачивание всех отрендеренных шардов кадров
        uses: actions/download-artifact@v4
        with:
          pattern: "frames-*"
          path: output/downloaded_shards

      - name: 5. Сортировка кадров по эпизодам и кодирование видео
        run: |
          python -c "
          import os, shutil, glob, subprocess, sys

          shards_root = 'output/downloaded_shards'
          ep_frames_root = 'output/episodes_frames'
          ep_video_root = 'output/episodes_video'

          episodes_map = {}

          # Поиск всех файлов frame_XXXX.png во всех скачанных папках шардов
          for root, dirs, files in os.walk(shards_root):
              for fname in files:
                  if fname.startswith('frame_') and fname.endswith('.png'):
                      dir_name = os.path.basename(root)
                      if dir_name.startswith('frames-') and '-shard-' in dir_name:
                          ep_name = dir_name[len('frames-'):dir_name.rfind('-shard-')]
                      else:
                          parts = dir_name.split('-')
                          ep_name = '-'.join(parts[1:-2]) if len(parts) >= 3 and parts[0] == 'frames' else 'unknown'

                      if ep_name not in episodes_map:
                          episodes_map[ep_name] = []

                      full_path = os.path.join(root, fname)
                      episodes_map[ep_name].append((fname, full_path))

          if not episodes_map:
              print('Error: no rendered frames found in downloaded shards!', file=sys.stderr)
              sys.exit(1)

          sorted_episodes = sorted(episodes_map.keys())
          print(f'Found rendered frames for {len(sorted_episodes)} episodes: {sorted_episodes}')

          assembled_videos = []

          for ep in sorted_episodes:
              frames = episodes_map[ep]
              ep_dir = os.path.join(ep_frames_root, ep)
              os.makedirs(ep_dir, exist_ok=True)

              for fname, src_path in frames:
                  dst_path = os.path.join(ep_dir, fname)
                  if not os.path.exists(dst_path):
                      shutil.copy2(src_path, dst_path)

              collected_count = len(glob.glob(os.path.join(ep_dir, 'frame_*.png')))
              print(f'Episode {ep}: collected {collected_count} frames.')

              out_mp4 = os.path.abspath(os.path.join(ep_video_root, f'{ep}.mp4'))
              cmd = [
                  'ffmpeg', '-y',
                  '-framerate', '30',
                  '-pattern_type', 'glob',
                  '-i', f'{ep_dir}/frame_*.png',
                  '-c:v', 'libx264',
                  '-preset', 'fast',
                  '-crf', '17',
                  '-pix_fmt', 'yuv420p',
                  '-color_primaries', 'bt709',
                  '-color_trc', 'bt709',
                  '-colorspace', 'bt709',
                  out_mp4
              ]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  print(f'Error encoding {ep}:\n{res.stderr}', file=sys.stderr)
                  sys.exit(1)
              print(f'Successfully built video: {out_mp4}')
              assembled_videos.append(out_mp4)

          # Создание файла со списком для бесшовной склейки
          with open('concat_list.txt', 'w', encoding='utf-8') as f:
              for v in assembled_videos:
                  f.write(f\"file '{v}'\n\")

          print('Concat list created successfully.')
          "

      - name: 6. Склейка всех эпизодов в единый мастер-фильм (-c copy)
        run: |
          OUT_NAME="${{ github.event.inputs.output_name || 'master_movie' }}"
          ffmpeg -y -f concat -safe 0 -i concat_list.txt \
            -c copy \
            "output/movie/${OUT_NAME}.mp4"

      - name: 7. Загрузка фильма в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.output_name || 'master_movie' }}-${{ github.event.inputs.profile }}"
          path: output/movie/*.mp4
          retention-days: 14

      - name: 8. Загрузка видео каждого эпизода отдельно в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: "all-episodes-individual-videos"
          path: output/episodes_video/*.mp4
          retention-days: 7

      - name: 9. Публикация в GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT_NAME="${{ github.event.inputs.output_name || 'master_movie' }}"
          PROFILE="${{ github.event.inputs.profile }}"
          TAG="movie-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" "output/movie/${OUT_NAME}.mp4" \
            --title "${OUT_NAME} (${PROFILE}) - ${TAG}" \
            --notes "Автоматическая сборка фильма с параллельным рендером на шардах GitHub Actions." 
